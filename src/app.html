<!doctype html>
<html lang="pt">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- SEO Base -->
	<title>Duck Shop | Patos de Borracha Temáticos | Porto, Portugal</title>

	<link rel="canonical" href="https://duck-shop-ff.vercel.app" />

	<!-- Open Graph -->
	<meta property="og:title" content="Duck Shop — O pato certo para cada personalidade" />
	<meta property="og:description" content="Patos de borracha temáticos com personalidade. Tech, cultura pop, Portugal. Descobre o teu." />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image" />

	<meta name="twitter:description" content="Patos de borracha temáticos com personalidade. Tech, cultura pop, Portugal." />

	<!-- Schema.org JSON-LD -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "Store",
		"name": "Duck Shop",
		"description": "E-commerce de patos de borracha temáticos — Tech, personagens, Portugal e muito mais.",

			"@type": "PostalAddress",
			"addressLocality": "Porto",
			"addressCountry": "PT"
		},
		"priceRange": "€10–€25",
		"currenciesAccepted": "EUR",
		"paymentAccepted": "Credit Card",
		"openingHours": "Mo-Su 00:00-23:59"

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
